name: CI/CD for React App

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Skip Tests for CI/CD Demo
        working-directory: frontend
        run: echo "Skipped tests for this class demo"

      - name: Build React App
        working-directory: frontend
        run: CI=false npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USER}}
          password: ${{secrets.DOCKER_PASSW}}

      - name: Build Docker Image
        run: |
          cd frontend
          docker build -t ${{secrets.DOCKER_USER}}/testexample:latest .


      - name: Push Docker Image
        run: docker push ${{secrets.DOCKER_USER}}/testexample:latest 
